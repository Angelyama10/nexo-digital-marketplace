services:
  postgres:
    image: postgres:17-alpine
    container_name: nexo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    volumes:
      - nexo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace} -d ${POSTGRES_DB:-marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-alpine
    container_name: nexo-redis-dev
    restart: unless-stopped
    volumes:
      - nexo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: nexo-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nexo-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace_dev_password}@postgres:5432/${POSTGRES_DB:-marketplace}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-only-change-before-deploy}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-development-refresh-only-change-before-deploy}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRANSFER_BANK_NAME: ${TRANSFER_BANK_NAME:-}
      TRANSFER_ACCOUNT_HOLDER: ${TRANSFER_ACCOUNT_HOLDER:-}
      TRANSFER_ACCOUNT_NUMBER: ${TRANSFER_ACCOUNT_NUMBER:-}
      TRANSFER_CLABE: ${TRANSFER_CLABE:-}
      TRANSFER_INSTRUCTIONS: ${TRANSFER_INSTRUCTIONS:-}
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - nexo_backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: nexo-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: nexo-frontend-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001/api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - nexo_frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nexo_postgres_data:
  nexo_redis_data:
  nexo_backend_node_modules:
  nexo_frontend_node_modules:
