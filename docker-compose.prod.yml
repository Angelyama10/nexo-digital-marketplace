services:
  postgres:
    image: postgres:17-alpine
    container_name: nexo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatorio}
    volumes:
      - nexo_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER es obligatorio} -d ${POSTGRES_DB:?POSTGRES_DB es obligatorio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-alpine
    container_name: nexo-redis
    restart: unless-stopped
    volumes:
      - nexo_redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: nexo-backend-migrate:local
    pull_policy: build
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER es obligatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB es obligatorio}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: nexo-backend-migrate:local
    pull_policy: never
    command: ["npm", "run", "prisma:seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER es obligatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB es obligatorio}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    image: nexo-backend:local
    pull_policy: build
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: nexo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER es obligatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB es obligatorio}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL es obligatorio}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET es obligatorio}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET es obligatorio}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRANSFER_BANK_NAME: ${TRANSFER_BANK_NAME:?TRANSFER_BANK_NAME es obligatorio}
      TRANSFER_ACCOUNT_HOLDER: ${TRANSFER_ACCOUNT_HOLDER:?TRANSFER_ACCOUNT_HOLDER es obligatorio}
      TRANSFER_ACCOUNT_NUMBER: ${TRANSFER_ACCOUNT_NUMBER:-}
      TRANSFER_CLABE: ${TRANSFER_CLABE:-}
      TRANSFER_INSTRUCTIONS: ${TRANSFER_INSTRUCTIONS:-}
    depends_on:
      seed:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: nexo-frontend:local
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: nexo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  caddy:
    image: caddy:2.11.4-alpine
    container_name: nexo-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN es obligatorio}
      WWW_DOMAIN: ${WWW_DOMAIN:?WWW_DOMAIN es obligatorio}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - nexo_caddy_data:/data
      - nexo_caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  nexo_postgres_data_prod:
  nexo_redis_data_prod:
  nexo_caddy_data:
  nexo_caddy_config:
